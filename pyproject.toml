[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lgmt"
version = "0.1.0"
description = "Logic-Guided Metamorphic Testing for evaluating LLM logical reasoning reliability"
readme = { text = "LGMT: first-order-logic metamorphic testing for LLM logical reasoning.", content-type = "text/plain" }
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "nltk>=3.9",
    "openai>=1.0",
    "httpx>=0.27",
    "PyYAML>=6.0",
    "jsonschema>=4.0",
    "json-repair>=0.30",
    "loguru>=0.7",
    "tqdm>=4.60",
    "colorama>=0.4.6",
]

[project.scripts]
lgmt = "lgmt.cli:main"

[tool.setuptools.packages.find]
include = ["lgmt*"]

[tool.setuptools.package-data]
"lgmt.demo" = ["*.jsonl"]
"lgmt.data" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# LGMT's core dataclass is named TestCase; keep pytest from trying to
# collect it as a test class.
python_classes = ["LGMTTest*"]
