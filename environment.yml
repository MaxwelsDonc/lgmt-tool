name: lgmt_env
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.12
  - pip

  # core runtime (mirrors requirements.txt)
  - pyyaml
  - jsonschema
  - loguru
  - tqdm
  - colorama

  # test/development extras (mirrors requirements-dev.txt)
  - pytest
  - z3-solver
  - nltk

  # pip-only packages
  - pip:
    - openai>=1.0
    - httpx>=0.27
    - json-repair>=0.30
