name: Publish Docker image

# Builds the all-in-one image and pushes it to the GitHub Container Registry so
# reviewers can `docker run` it without building anything:
#
#   docker run --rm -p 7860:7860 ghcr.io/maxwelsdonc/lgmt-tool
#
# Runs on every push to main that can change the image, on version tags, and
# on demand.

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "Dockerfile"
      - "docker-entrypoint.sh"
      - "pyproject.toml"
      - "lgmt/**"
      - "data/**"
      - "examples/**"
      - ".github/workflows/docker-publish.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          # GHCR requires a lowercase repository path.
          images: ghcr.io/maxwelsdonc/lgmt-tool
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=LGMT
            org.opencontainers.image.description=Logic-Grounded Metamorphic Testing for LLM reasoning reliability
            org.opencontainers.image.licenses=MIT

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # What a reviewer on another machine will actually get: log out first, so
      # this only passes if the package is public, then run the README commands.
      - name: Smoke-test the published image (anonymous pull)
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          docker logout ghcr.io
          IMG=ghcr.io/maxwelsdonc/lgmt-tool:latest
          docker pull "$IMG"
          docker run --rm "$IMG" lgmt demo --quiet
          docker run --rm "$IMG" lgmt demo --full --quiet
          docker run --rm "$IMG" sh -c 'lgmt demo --quiet && test -s demo_output/report.html && echo "report OK"'
          docker run --rm "$IMG" lgmt list-mrs | grep -q "MR-C3"
          echo "CLI + full benchmark OK"

      - name: Smoke-test Web Studio in the published image
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          IMG=ghcr.io/maxwelsdonc/lgmt-tool:latest
          docker run -d --rm -p 7860:7860 --name lgmt-smoke "$IMG" lgmt-web
          ok=0
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:7860/ | grep -q "Quick Demo"; then ok=1; break; fi
            sleep 1
          done
          docker rm -f lgmt-smoke >/dev/null 2>&1 || true
          test "$ok" = 1
          echo "Web Studio OK"
