name: Publish Docker image

# Builds the all-in-one image and pushes it to the GitHub Container Registry so
# reviewers can `docker run` it without building anything:
#
#   docker run --rm -p 7860:7860 ghcr.io/maxwelsdonc/lgmt-tool
#
# Runs on every push to main that can change the image, on version tags, and
# on demand.

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "Dockerfile"
      - "docker-entrypoint.sh"
      - "pyproject.toml"
      - "lgmt/**"
      - "data/**"
      - "examples/**"
      - ".github/workflows/docker-publish.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          # GHCR requires a lowercase repository path.
          images: ghcr.io/maxwelsdonc/lgmt-tool
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=LGMT
            org.opencontainers.image.description=Logic-Grounded Metamorphic Testing for LLM reasoning reliability
            org.opencontainers.image.licenses=MIT

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
