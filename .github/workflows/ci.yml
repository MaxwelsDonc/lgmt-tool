name: CI

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run test suite
        run: pytest

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: lgmt:ci

  # Literal reproduction of README "Try it → Option 2" on a real machine of
  # each OS. Catches platform-specific documentation errors (e.g. a venv
  # command that only exists on one OS) that the pytest matrix cannot see.
  readme-smoke:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create virtualenv (README command)
        run: python -m venv .venv

      - name: Activate (Unix)
        if: runner.os != 'Windows'
        run: echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Activate (Windows)
        if: runner.os == 'Windows'
        run: echo "$env:GITHUB_WORKSPACE\.venv\Scripts" >> "$env:GITHUB_PATH"
        shell: pwsh

      - name: Install (README command)
        run: python -m pip install -e .

      - name: Run offline demo (README command)
        run: lgmt demo

      - name: Verify report artifact
        run: |
          if (Test-Path demo_output/report.html) { Write-Host "report OK" } else { exit 1 }
        shell: pwsh
